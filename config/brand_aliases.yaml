# Ручные синонимы брендов: канон -> [синонимы]. Источник для `attrx build-dicts`, который сливает их с брендами
# каталога (vendor офферов train-сплита) в config/dictionaries/brands.yaml. После правки — перегенерировать.
#
# Что сюда класть:
# - кириллические написания, которых нет в каталоге как vendor (в названиях карточек и описаниях их пишут продавцы
#   маркетплейса, в поиске — покупатели): «Самсунг», «Сяоми», «Хуавей»;
# - суббренды/линейки, которые каталог записывает то как отдельный vendor, то как бренд-родитель
#   («Redmi», «POCO» -> Xiaomi; «iPhone» -> Apple): эталон и предсказание сравниваются по канону.
# Короткие и многозначные слова («Mi», «Pro», «Томас») сюда не добавлять: защиту от омонимов строит build-dicts
# по статистике train, но для ручного синонима, которого нет в названиях train, её не будет.
Apple: [эпл, эппл, iphone, macbook]
Samsung: [самсунг]
Xiaomi: [сяоми, ксиаоми, ксяоми, redmi, poco, Xiaomi Redmi, Xiaomi Mi]
