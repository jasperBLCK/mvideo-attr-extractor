# Источник: vendor офферов YML-фида М.Видео, только train-сплит (md5(sku_id) % 100 < 80), бренды с >= 2 офферами;
# канон — самое частое написание в каталоге; синонимы — ручные + кириллица по транслиту («Атлант» ~ ATLANT).
# Брендов: 4822. Проверка на 193304 названиях train: бренд товара = первое упоминание
