# Базовая палитра цветов: канон -> синонимы (RU/EN, маркетинговые названия производителей).
# Сравнение регистронезависимое, ё=е; прилагательные матчатся в любом роде и числе («черная», «черные»).
# Составлено по каталогу М.Видео: значения параметров «Цвет»/«Цвет_search»/«Цвет производителя» (1 560 уникальных,
# топ-300 покрывают 98% офферов) сведены к 17 базовым цветам, как в фильтре каталога. Многоцветные значения
# («черный/ красный») разбиваются по «/» и дают несколько допустимых значений (normalize.normalize_colors).
# «другие цвета», «прочие», «комбинированный» — не цвет, эталоном не считаются.
