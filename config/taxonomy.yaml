# Таксономия: категории каталога М.Видео -> обязательные атрибуты.
#
# Категория:
#   category_ids — id листовых категорий YML-фида (data/processed/categories.parquet), которые она покрывает;
#                  карточка с известным category_id попадает сюда с уверенностью 1.0 (иначе — keywords).
#   keywords     — запасной путь, если category_id неизвестен (cold start, внешний продавец).
# Атрибут:
#   type   — enum (значение из справочника config/dictionaries/<dictionary>.yaml), number (число + единица),
#            string (свободная строка: модель, процессор), bool (да/нет; keywords — признаки «да» в тексте)
#   unit/kind — каноническая единица и тип величины для нормализации (normalize.UNIT_PATTERNS)
#   aliases — как атрибут называют продавцы в блоке «Характеристики:» (ключи из taxonomy_candidates.json)
#   gold    — откуда брать эталон в YML-фиде: vendor | model | имена param (базовые, без «_search»), по приоритету;
#             у каждого param сначала берётся точный вариант `_search`, бакет фильтра («6.6" и более») — только
#             если он не диапазон (см. eval/gold.py)
#   traffic_weight — вес по поисковому спросу внутри категории (по умолчанию; переопределяется
#             config/traffic_weights.yaml из query_clicks, см. eval/metrics.py)
#
# Состав выбран по данным (taxonomy_candidates.json, top_queries.parquet): топ категорий по доле кликов;
# в каждой — бренд, модель и 3–5 характеристик с высокой заполненностью в каталоге × спросом в запросах
# × извлекаемостью из текста. Смартфоны и ноутбуки — ровно обязательный перечень кейса.

categories:
  smartphone:
    title: Смартфоны
    category_ids: ["761", "914"]  # Смартфоны, iPhone
    keywords: [смартфон, smartphone, телефон, iphone, galaxy, redmi, poco, pixel]
    attributes:
      brand:    {title: Бренд, type: enum, dictionary: brands, gold: [vendor], aliases: [бренд, производитель, марка, brand, manufacturer, торговая марка], traffic_weight: 1.0}
      model:    {title: Модель, type: string, kind: model, gold: [model, Серия, Модель], aliases: [модель, model, серия, модель телефона, модель смартфона], traffic_weight: 0.9}
      storage:  {title: Объём встроенной памяти, type: number, unit: ГБ, kind: memory, gold: ["Встроенная память (ROM)", "Встроенная память"], aliases: [встроенная память, объем памяти, объём памяти, память, rom, storage, внутренняя память, объем встроенной памяти, объём встроенной памяти, встроенная память (rom), встроенная память (гб)], traffic_weight: 0.8}
      screen:   {title: Диагональ экрана, type: number, unit: дюйм, kind: diagonal, gold: [Диагональ, Экран], aliases: [диагональ, диагональ экрана, экран, screen, display, диагональ дисплея, размер экрана], traffic_weight: 0.5}
      battery:  {title: Ёмкость аккумулятора, type: number, unit: мА·ч, kind: battery, gold: [Емкость аккумулятора], aliases: [аккумулятор, емкость аккумулятора, ёмкость аккумулятора, батарея, battery, емкость батареи, ёмкость батареи], traffic_weight: 0.4}
      color:    {title: Цвет, type: enum, dictionary: colors, gold: [Цвет, Цвет производителя], aliases: [цвет, color, colour, цвет корпуса, цвет товара], traffic_weight: 0.6}

