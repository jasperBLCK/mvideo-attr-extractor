<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>attrx: характеристики товаров</title>
  <meta name="description" content="Консоль модератора каталога: характеристики из карточек товаров с цитатой, источником и уверенностью, очередь проверки и качество на эталоне.">
  <meta name="theme-color" content="#f0f1f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/static/assets/favicon.svg" type="image/svg+xml">
  <script>
    // тема до первой отрисовки, чтобы не мигало
    try { var t = localStorage.getItem("attrx.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="preload" href="/static/assets/fonts/onest-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/assets/fonts/onest-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/assets/fonts/literata-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/styles.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">К содержимому</a>

  <header class="bar">
    <div class="bar__in">
      <a class="brand" href="#/card" aria-label="attrx, контроль характеристик: к карточке">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__name" translate="no">attrx</span>
        <span class="brand__sub">Контроль характеристик</span>
      </a>

      <nav class="nav" aria-label="Разделы">
        <a class="nav__link" href="#/card" data-route="card">
          <svg class="i" width="16" height="16" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="/static/assets/icons.svg#file-text"/></svg>
          <span>Карточка</span>
        </a>
        <a class="nav__link" href="#/review" data-route="review">
          <svg class="i" width="16" height="16" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="/static/assets/icons.svg#tray"/></svg>
          <span>Очередь<span class="nav__long"> проверки</span></span>
          <span class="nav__count" id="queue-count" hidden></span>
        </a>
        <a class="nav__link" href="#/quality" data-route="quality">
          <svg class="i" width="16" height="16" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="/static/assets/icons.svg#chart-line-up"/></svg>
          <span>Качество</span>
        </a>
      </nav>

      <div class="bar__tools">
        <button class="cmdk" id="open-palette" type="button" aria-haspopup="dialog" aria-keyshortcuts="Control+K Meta+K" aria-label="Собрать экран или найти карточку">
          <svg class="i" width="16" height="16" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="/static/assets/icons.svg#magnifying-glass"/></svg>
          <span class="cmdk__label">Собрать экран или найти</span>
          <span class="cmdk__keys" aria-hidden="true"></span>
        </button>
        <button class="llm-status" id="llm-status" type="button" data-state="off">
          <span class="llm-status__dot" aria-hidden="true"></span>
          <span class="llm-status__text">LLM</span>
        </button>
        <button class="icon-btn" id="open-help" type="button" aria-haspopup="dialog" aria-keyshortcuts="?" aria-label="Справка: как читать экран" data-tip="Справка">
          <svg class="i" width="18" height="18" viewBox="0 0 256 256" aria-hidden="true" focusable="false"><use href="/static/assets/icons.svg#question"/></svg>
        </button>
        <button class="icon-btn" id="theme" type="button" aria-label="Тема"></button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <section class="view view--bench" id="view-card" data-view="card" hidden></section>
    <section class="view" id="view-review" data-view="review" hidden></section>
    <section class="view view--qa" id="view-quality" data-view="quality" hidden></section>
  </main>

  <dialog class="palette" id="palette" aria-label="Палитра команд"></dialog>
  <dialog class="drawer" id="help" aria-labelledby="help-title"></dialog>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <div class="tip" id="tip" role="tooltip" hidden></div>
  <div class="sr-only" id="live" aria-live="polite"></div>
  <noscript><p class="noscript">Для работы интерфейса нужен JavaScript. API доступно на /docs.</p></noscript>
</body>
</html>
